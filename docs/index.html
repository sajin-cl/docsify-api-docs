<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="utf-8">

  <title>My API Documentation</title>

  <meta
    name="description"
    content="My API Documentation"
  >

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <link
    rel="icon"
    href="logo.avif"
  >

  <link
    rel="stylesheet"
    href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css"
  >

  <link
    rel="stylesheet"
    href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css"
  >

</head>

<body>

  <div id="app"></div>

  <script>

    window.$docsify = {

      name: 'MY API DOCUMENTATION',

      loadSidebar: true,

      subMaxLevel: 3

    }

  </script>

  <!-- Docsify -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>

  <!-- Search -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>

  <!-- Copy Code -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@3/dist/docsify-copy-code.min.js"></script>

</body>
</html>
